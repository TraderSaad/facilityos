services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: facilityos
      POSTGRES_PASSWORD: facilityos_secret
      POSTGRES_DB: facilityos
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  db_data:
